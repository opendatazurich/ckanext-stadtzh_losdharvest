description:
  en:
    localisedName: ckanext-stadtzh_losdharvest
    shortDescription: CKAN extension implementing a harvester to import datasets from the City of Zürich's LOSD portal to its CKAN instance (https://data.stadt-zuerich.ch/)
    longDescription: ckanext-stadtzh_losdharvest is a plugin/extension for CKAN, based on ckanext-harvest (https://github.com/ckan/ckanext-harvest) and ckanext-dcat (https://github.com/ckan/ckanext-dcat), that implements a harvester to import datasets from the City of Zürich's Linked Open Statistical Data (LOSD) portal (https://ld.integ.stzh.ch/sparql/) to their OGD Platform (https://data.stadt-zuerich.ch/).
    features:
      - implementing a harvester that imports data from LOSD to OGD
